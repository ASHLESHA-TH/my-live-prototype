<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heatwave Early Warning System</title>
    
    <!-- Leaflet.js CSS for Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #d32f2f;
            color: white;
            padding: 15px;
            text-align: center;
        }
        #container {
            display: flex;
            flex: 1;
        }
        #sidebar {
            width: 300px;
            background-color: #f5f5f5;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        #map {
            flex: 1;
            height: 100%;
        }
        .btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>☀️ India Heatwave Early Warning & Vulnerability Mapper</h1>
        <p>Ward-Level Alerts & Cooling Shelter Routing System</p>
    </header>

    <div id="container">
        <div id="sidebar">
            <h3>⚠️ Risk Control Panel</h3>
            <p><strong>IMD Forecast Data:</strong> Loaded</p>
            <p><strong>Active Alert:</strong> Level-3 Extreme Heat Wave</p>
            <button class="btn" onclick="showHeatmap()">Simulate Ward Vulnerability</button>
            <button class="btn" style="background-color: #388e3c;" onclick="findShelter()">Route to Nearest Cooling Shelter</button>
            
            <div id="status-box" style="margin-top: 20px; font-size: 0.9em; color: #555;">
                Click a button to interact with the system demo.
            </div>
        </div>
        
        <!-- The visual map element -->
        <div id="map"></div>
    </div>

    <!-- Leaflet JS Script -->
    <script src="https://unpkg.com"></script>
    <script>
        // Initialize the map centered around India (coordinates point near Nagpur for central view)
        const map = L.map('map').setView([21.1458, 79.0882], 5);

        // Load OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function showHeatmap() {
            document.getElementById('status-box').innerHTML = "🟢 <strong>Simulating Ward Heatmap:</strong> Red circles indicate dense urban slums/informal settlements combined with high IMD temperatures.";
            
            // Add a mock vulnerability hotspot circle (Example: High risk zone)
            const highRiskZone = L.circle([21.1458, 79.0882], {
                color: 'red',
                fillColor: '#f03',
                fillOpacity: 0.5,
                radius: 150000 // scale for visual representation
            }).addTo(map).bindPopup("<b>High Risk Ward 12</b><br>Informal Settlement Density: High<br>Outdoor Workers: 64%<br>Estimated Temp: 46.5°C").openPopup();
        }

        function findShelter() {
            document.getElementById('status-box').innerHTML = "🔵 <strong>Routing Active:</strong> Generating fastest walking path for outdoor workers avoiding unshaded roads to the nearest NDMA cooling center.";
            
            // Add a mock cooling shelter pin
            const shelterMarker = L.marker([21.5000, 79.2000]).addTo(map)
                .bindPopup("<b>NDMA Cooling Shelter #4</b><br>Capacity: 120 people<br>Amenities: Clean water, ORS, AC").openPopup();
        }
    </script>
</body>
</html>
